<style>
:root{--bg:#16181d;--panel:#1f222a;--panel2:#272b35;--line:#343947;--text:#e6e8ee;--muted:#9aa1b2;--acc:#4f8cff;--acc2:#3a6fd8;--head:180px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif;overflow:hidden}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;white-space:nowrap}
button:hover{border-color:var(--acc)}
button:disabled{opacity:.4;cursor:default}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.primary:hover{background:var(--acc2)}
button.icon{padding:2px 7px;font-size:12px}
button.on{background:#5a2a2a;border-color:#a44}
input,select,textarea{background:#12141a;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 6px;font:inherit}
input[type=color]{padding:0 2px;height:26px;width:44px}
input[type=range]{padding:0}
textarea{width:100%;resize:vertical;min-height:60px}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 6px 0 0;font-weight:600}
.brand{display:flex;align-items:center;background:#fff;border-radius:6px;padding:2px 6px;height:34px}
.brand img{height:30px;display:block}
#about{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100}
#about[hidden]{display:none}
#about .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:400px;max-width:calc(100% - 32px);overflow:hidden;text-align:center}
#about .logo{background:#fff;padding:16px}
#about .logo img{width:100%;max-width:300px}
#about .body{padding:16px 22px 20px;line-height:1.7}
#about h3{margin:0 0 4px;font-size:17px}
#about a{color:var(--acc)}
#about .muted{color:var(--muted)}
.credit{margin-top:18px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.credit a{color:var(--acc)}
.spacer{flex:1}
main{flex:1;display:flex;min-height:0}
#lib{width:240px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line)}
#lib .top{padding:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
#libList{flex:1;overflow:auto;padding:6px}
#libList.drag{outline:2px dashed var(--acc);outline-offset:-6px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.mi{display:flex;align-items:center;gap:6px;padding:5px;border-radius:6px;cursor:grab;border:1px solid transparent}
.mi:hover{background:var(--panel2);border-color:var(--line)}
.mi .th{width:56px;height:36px;flex:none;border-radius:4px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.mi .th img,.mi .th video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.mi .ai{font-size:20px;color:#e0a060}
.mi .mn{flex:1;min-width:0}
.mi .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi small{color:var(--muted)}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#stage{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0;position:relative;background:#0e1014}
#stage.drag{outline:2px dashed var(--acc);outline-offset:-8px}
#cv{max-width:100%;max-height:100%;background:#000;box-shadow:0 0 0 1px #333;cursor:move;touch-action:none}
#hint{position:absolute;color:var(--muted);text-align:center;pointer-events:none;font-size:14px;line-height:1.7}
#transport{display:flex;align-items:center;gap:10px;justify-content:center;padding:6px;border-top:1px solid var(--line);background:var(--panel)}
#time{font-variant-numeric:tabular-nums;min-width:130px;text-align:center}
#play{font-size:15px;width:44px}
#props{width:280px;flex:none;overflow:auto;padding:10px 12px;background:var(--panel);border-left:1px solid var(--line)}
#props h3{margin:2px 0 10px;font-size:14px}
#props .sec{margin:14px 0 6px;font-weight:600;color:var(--acc);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
#props .f{display:flex;align-items:center;gap:8px;margin:6px 0}
#props .f label{flex:1;color:var(--muted)}
#props .f input[type=number]{width:80px}
#props .f input[type=range]{width:110px}
#props .f select{width:150px}
#props .f .v{width:42px;text-align:right;font-variant-numeric:tabular-nums}
#props .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#props .tip{color:var(--muted);line-height:1.6}
#props .tip b{color:var(--text)}
#tl{height:300px;flex:none;display:flex;flex-direction:column;border-top:1px solid var(--line);background:var(--panel)}
#tlbar{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line)}
#tlbar .lbl{color:var(--muted);margin-left:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
#tlbar .lbl:last-of-type{flex:none}
#tlscroll{flex:1;overflow:auto;position:relative}
#tlinner{position:relative;min-width:100%}
.row{display:flex;height:58px;border-bottom:1px solid var(--line)}
.row.ruler{height:24px;position:sticky;top:0;z-index:7;background:var(--panel);cursor:pointer}
.head{width:var(--head);flex:none;position:sticky;left:0;z-index:5;background:var(--panel2);border-right:1px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;gap:4px;justify-content:center}
.ruler .head{z-index:8;background:var(--panel);color:var(--muted);font-size:11px;flex-direction:row;align-items:center}
.head input{width:100%;padding:2px 5px;background:transparent;border-color:transparent}
.head input:hover,.head input:focus{border-color:var(--line);background:#12141a}
.head .hb{display:flex;gap:3px}
.row.sel .head{box-shadow:inset 3px 0 0 var(--acc)}
.row.sel .lane{background:rgba(79,140,255,.05)}
.row.hidden .lane{opacity:.4}
.lane{position:relative;flex:1}
.lane.drop{background:rgba(79,140,255,.15)}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);font-size:10px;color:var(--muted);padding-left:3px;pointer-events:none}
.clip{position:absolute;top:5px;bottom:5px;border-radius:5px;overflow:hidden;cursor:grab;border:1px solid rgba(255,255,255,.25);color:#fff;font-size:11px;padding:3px 7px;white-space:nowrap;background-size:auto 100%;background-repeat:repeat-x;user-select:none}
.clip.image{background-color:#2f6b4c}.clip.video{background-color:#34508f}.clip.audio{background-color:#7d5226}.clip.text{background-color:#6d3580}
.clip .lbl{background:rgba(0,0,0,.55);padding:0 4px;border-radius:3px;position:relative;z-index:1}
.clip.sel{outline:2px solid #fff;outline-offset:-1px;z-index:2}
.clip .tri,.clip .tro{position:absolute;top:0;bottom:0;pointer-events:none}
.clip .tri{left:0;background:linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,0))}
.clip .tro{right:0;background:linear-gradient(270deg,rgba(0,0,0,.6),rgba(0,0,0,0))}
.clip .hl,.clip .hr{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize;z-index:3}
.clip .hl{left:0}.clip .hr{right:0}
.clip .hl:hover,.clip .hr:hover{background:rgba(255,255,255,.35)}
#playhead{position:absolute;top:0;width:2px;background:#ff4d4d;pointer-events:none;z-index:6}
#playhead::before{content:"";position:absolute;top:0;left:-5px;border:6px solid transparent;border-top-color:#ff4d4d}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:100}
#ov[hidden]{display:none}
#ov .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px;width:420px}
#ov h3{margin:0 0 8px}
#ov p{color:var(--muted);margin:0 0 14px}
.bar{height:10px;background:#111;border-radius:5px;overflow:hidden}
#ovbar{height:100%;width:0;background:var(--acc)}
#ovtxt{margin:8px 0 14px;font-variant-numeric:tabular-nums}
</style>
</head>

/* ---------- anonymous usage statistics (can be turned off in General settings) ---------- */
function lsGet(k){ try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch (e) {} }
const statsEnabled = () => lsGet('svm-stats') !== '0';
function installId(){
  let id = lsGet('svm-iid');
  if (!id){ id = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); lsSet('svm-iid', id); }
  return id;
}
// Sends only: random install id, event name, app version, desktop/web, UI language, exported video length.
function ping(ev, extra){
  if (!statsEnabled()) return;
  try {
    const body = JSON.stringify(Object.assign({ iid: installId(), ev, v: APP_VERSION, src: location.protocol === 'file:' ? 'desktop' : 'web', ui: lang }, extra || {}));

}

let uid = 1; const nid = p => p + (uid++);

const els = new Map();             // clipId -> HTMLMediaElement

// A track shows its own `name` once the user renames it; until then its translated default `key`
const newTrack = key => ({ id:nid('t'), key, name:'', hidden:false, muted:false, clips:[] });

/* ---------- helpers ---------- */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const fmt = s => { s = Math.max(0, s); const m = Math.floor(s/60); return String(m).padStart(2,'0') + ':' + (s - m*60).toFixed(1).padStart(4,'0'); };
const ease = p => p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
function findClip(id){ for (const tr of S.tracks){ const c = tr.clips.find(c => c.id === id); if (c) return [c, tr]; } return [null, null]; }
function totalDur(){ let m = 0; for (const tr of S.tracks) for (const c of tr.clips) m = Math.max(m, c.start + c.dur); return m; }
const trackEnd = tr => tr.clips.reduce((m, c) => Math.max(m, c.start + c.dur), 0);
const curTrack = () => S.tracks.find(tr => tr.id === selTrack) || S.tracks[S.tracks.length - 1];
const audioTrack = () => S.tracks.find(tr => tr.key === 'Music / audio' || /nhạc|âm|audio|music/i.test(tr.name)) || curTrack();
const isAV = c => c.type === 'video' || c.type === 'audio';

/* ---------- history ---------- */
const hist = []; let hi = -1;
function commit(skipProps){
  hist.splice(hi + 1); hist.push(JSON.stringify(S));
  if (hist.length > 150) hist.shift();

  refresh(skipProps);
}
function restore(){ S = JSON.parse(hist[hi]); refresh(); }
function undo(){ if (hi > 0){ hi--; restore(); } }
function redo(){ if (hi < hist.length - 1){ hi++; restore(); } }
function refresh(skipProps){
  if (sel && !findClip(sel)[0]) sel = null;
  if (!S.tracks.find(tr => tr.id === selTrack)) selTrack = S.tracks[0] && S.tracks[0].id;
  if (cv.width !== S.w || cv.height !== S.h){ cv.width = S.w; cv.height = S.h; }
  $('#selRes').value = S.w + 'x' + S.h;
  $('#bUndo').disabled = hi <= 0; $('#bRedo').disabled = hi >= hist.length - 1;
  $('#hint').style.display = totalDur() > 0 ? 'none' : '';

}

/* ---------- import ---------- */
function guessType(f){
  if (f.type.startsWith('image/')) return 'image';
  if (f.type.startsWith('video/')) return 'video';
  if (f.type.startsWith('audio/')) return 'audio';
  const ext = f.name.split('.').pop().toLowerCase();
  if (['jpg','jpeg','png','gif','webp','bmp','avif'].includes(ext)) return 'image';
  if (['mp4','webm','mov','mkv','m4v','ogv'].includes(ext)) return 'video';
  if (['mp3','wav','ogg','m4a','aac','flac','opus'].includes(ext)) return 'audio';
  return null;
}
async function importFiles(files){
  const added = [], bad = [];
  for (const f of files){
    const type = guessType(f);
    if (!type){ bad.push(f.name); continue; }
    const url = URL.createObjectURL(f);
    const m = { id:nid('m'), name:f.name, type, url, duration:0, w:0, h:0 };
    try {
      if (type === 'image'){
        m.el = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
        m.w = m.el.naturalWidth; m.h = m.el.naturalHeight;
      } else {
        const e = document.createElement(type);
        e.preload = 'metadata'; e.src = url;
        await new Promise((res, rej) => { e.onloadedmetadata = res; e.onerror = rej; });
        m.duration = isFinite(e.duration) ? e.duration : 10;
        m.w = e.videoWidth || 0; m.h = e.videoHeight || 0;
        e.removeAttribute('src'); e.load();
      }
    } catch (err){ bad.push(f.name); URL.revokeObjectURL(url); continue; }
    media.set(m.id, m); added.push(m);
  }
  if (bad.length) alert(T('These files could not be read (format not supported by the browser):') + '\n' + bad.join('\n'));
  renderLibrary();
  return added;
}
function makeClip(m, start){
  const c = { id:nid('c'), type:m.type, mediaId:m.id, name:m.name, start, dur: m.type === 'image' ? S.imgDur : Math.max(0.1, m.duration || 5),
    trimIn:0, x:0, y:0, scale:1, opacity:1, fit:'contain', radius:0, trans:'none', transDur:0.8, fadeOut:0, motion:'none', volume:1, fadeIn:0 };
  if (m.type === 'audio'){ c.fadeIn = 0; c.fadeOut = 0; }
  return c;
}
function makeText(start){
  return { id:nid('c'), type:'text', name:T('Text'), start, dur:3, text:T('Your text here'), font:'Arial', size:80, color:'#ffffff', bold:true, italic:false,
    bg:'#000000', bgOpacity:0.45, stroke:false, strokeColor:'#000000', shadow:true, align:'center', x:0, y:0.35, scale:1, opacity:1, trans:'fade', transDur:0.5, fadeOut:0.5 };
}
function addMediaToTrack(ms, tr, at){
  let cur = at == null ? trackEnd(tr) : at;
  for (const m of ms){
    const c = makeClip(m, cur);
    const prev = tr.clips.find(o => o.type !== 'audio' && Math.abs(o.start + o.dur - cur) < 0.05);
    if (prev && c.type !== 'audio') c.trans = S.defTrans;
    tr.clips.push(c); cur += c.dur; sel = c.id;
  }
  selTrack = tr.id; commit();
}

/* ---------- media elements & audio ---------- */
let actx = null, recDest = null;
function ensureAudio(){
  if (actx){ if (actx.state === 'suspended') actx.resume(); return; }
  actx = new AudioContext();
  recDest = actx.createMediaStreamDestination();
  for (const e of els.values()) connectAudio(e);
}
function connectAudio(e){
  if (!actx || e._gain) return;
  const src = actx.createMediaElementSource(e), g = actx.createGain();
  src.connect(g); g.connect(actx.destination); g.connect(recDest); e._gain = g;
}
function clipEl(c){
  let e = els.get(c.id);
  if (e && e._mid === c.mediaId) return e;
  const m = media.get(c.mediaId); if (!m) return null;
  e = document.createElement(c.type === 'video' ? 'video' : 'audio');
  e.preload = 'auto'; e.playsInline = true; e._mid = c.mediaId; e.src = m.url;
  e.onseeked = e.onloadeddata = () => { if (!playing) draw(); };
  els.set(c.id, e); connectAudio(e);
  return e;
}
function envelope(c, tt){
  const lt = tt - c.start; let g = 1;
  const fi = c.type === 'audio' ? (c.fadeIn || 0) : (c.trans !== 'none' ? c.transDur : 0);
  if (fi > 0 && lt < fi) g *= clamp(lt / fi, 0, 1);
  if (c.fadeOut > 0 && lt > c.dur - c.fadeOut) g *= clamp((c.dur - lt) / c.fadeOut, 0, 1);
  return g;
}
function syncMedia(){
  const live = new Set();
  for (const tr of S.tracks) for (const c of tr.clips){
    if (!isAV(c)) continue;
    const e = clipEl(c); if (!e) continue; live.add(c.id);
    const end = c.start + c.dur, active = t >= c.start && t < end;
    const local = c.trimIn + clamp(t - c.start, 0, Math.max(c.dur - 0.05, 0));
    const v = (tr.muted ? 0 : (c.volume ?? 1)) * (active ? envelope(c, t) : 0);
    if (e._gain) e._gain.gain.value = v; else e.volume = clamp(v, 0, 1);
    if (active && playing){
      if (e.paused){ e.currentTime = local; e.play().catch(() => {}); }
      else if (Math.abs(e.currentTime - local) > 0.3) e.currentTime = local;
    } else {
      if (!e.paused) e.pause();
      const near = t >= c.start - 2 && t < end + 3;
      if (near && !e.seeking && Math.abs(e.currentTime - local) > 0.04) e.currentTime = local;
    }
  }
  for (const [id, e] of els) if (!live.has(id)){ e.pause(); }
}

/* ---------- rendering ---------- */
const cv = $('#cv'), cx = cv.getContext('2d');
function render(){ syncMedia(); draw(); }
function textLayout(c){
  const fs = c.size * S.h / 1080;
  const font = `${c.italic ? 'italic ' : ''}${c.bold ? 'bold ' : ''}${fs}px "${c.font}", sans-serif`;
  cx.font = font;
  const lines = String(c.text).split('\n'), lh = fs * 1.25, pad = fs * 0.35;
  let mw = 0; for (const l of lines) mw = Math.max(mw, cx.measureText(l).width);
  return { font, lines, lh, fs, pad, w: mw + pad*2, h: lines.length*lh + pad*2 };
}
function drawClip(c, tt, p, trans, rec, noFade){
  const W = S.w, H = S.h, lt = tt - c.start;
  let alpha = c.opacity ?? 1;
  if (!noFade && c.fadeOut > 0 && lt > c.dur - c.fadeOut) alpha *= clamp((c.dur - lt) / c.fadeOut, 0, 1);
  let src, bw, bh, tl;
  if (c.type === 'text'){ tl = textLayout(c); bw = tl.w; bh = tl.h; }
  else {
    let sw, sh;
    if (c.type === 'image'){ const m = media.get(c.mediaId); if (!m) return; src = m.el; sw = m.w; sh = m.h; }
    else { const e = clipEl(c); if (!e || e.readyState < 2 || !e.videoWidth) return; src = e; sw = e.videoWidth; sh = e.videoHeight; }
    if (c.fit === 'stretch'){ bw = W; bh = H; }
    else { const k = c.fit === 'cover' ? Math.max(W/sw, H/sh) : Math.min(W/sw, H/sh); bw = sw*k; bh = sh*k; }
  }
  let s = c.scale ?? 1, px = W/2 + c.x*W, py = H/2 + c.y*H;
  if (c.motion && c.motion !== 'none' && c.type !== 'text'){
    const q = clamp(lt / c.dur, 0, 1);
    if (c.motion === 'zoomin') s *= 1 + 0.15*q;
    else if (c.motion === 'zoomout') s *= 1.15 - 0.15*q;
    else { s *= 1.12; px += (c.motion === 'panL' ? 1 : -1) * (0.5 - q) * 0.1 * W; }
  }
  let dx = 0, dy = 0, clipMode = null;
  if (p < 1){
    switch (trans){
      case 'fade': alpha *= p; break;
      case 'slideL': dx = (1-p)*W; break;
      case 'slideR': dx = -(1-p)*W; break;
      case 'slideU': dy = (1-p)*H; break;
      case 'slideD': dy = -(1-p)*H; break;
      case 'zoom': s *= 0.5 + 0.5*p; alpha *= p; break;
      case 'wipe': clipMode = 'wipe'; break;
      case 'circle': clipMode = 'circle'; break;
    }
  }
  const w = bw*s, h = bh*s, x = px - w/2 + dx, y = py - h/2 + dy;
  if (rec) hitRects.set(c.id, { x, y, w, h });
  if (alpha <= 0.001) return;
  cx.save(); cx.globalAlpha = alpha;
  if (clipMode === 'wipe'){ cx.beginPath(); cx.rect(x, y, w*p, h); cx.clip(); }
  if (clipMode === 'circle'){ cx.beginPath(); cx.arc(x + w/2, y + h/2, Math.hypot(w, h)/2*p, 0, Math.PI*2); cx.clip(); }
  if (c.type === 'text'){
    cx.translate(x, y); cx.scale(s, s);
    if (c.bgOpacity > 0){
      cx.save(); cx.globalAlpha = alpha * c.bgOpacity; cx.fillStyle = c.bg;
      cx.beginPath(); cx.roundRect(0, 0, bw, bh, tl.fs*0.2); cx.fill(); cx.restore();
    }
    cx.font = tl.font; cx.textBaseline = 'middle'; cx.textAlign = c.align;
    const tx = c.align === 'left' ? tl.pad : c.align === 'right' ? bw - tl.pad : bw/2;
    if (c.shadow){ cx.shadowColor = 'rgba(0,0,0,.7)'; cx.shadowBlur = tl.fs*0.12; cx.shadowOffsetY = tl.fs*0.04; }
    tl.lines.forEach((l, i) => {
      const ty = tl.pad + tl.lh*(i + 0.5);
      if (c.stroke){ cx.lineWidth = tl.fs*0.1; cx.lineJoin = 'round'; cx.strokeStyle = c.strokeColor; cx.strokeText(l, tx, ty); }
      cx.fillStyle = c.color; cx.fillText(l, tx, ty);
    });

    if (c.radius > 0){ cx.beginPath(); cx.roundRect(x, y, w, h, Math.min(w, h)/2 * c.radius/100); cx.clip(); }
    cx.drawImage(src, x, y, w, h);
  }

}
function activeVisual(tr, tt){
  return tr.clips.filter(c => c.type !== 'audio' && tt >= c.start && tt < c.start + c.dur).sort((a, b) => a.start - b.start);
}
function draw(){
  const W = S.w, H = S.h;
  cx.setTransform(1,0,0,1,0,0); cx.globalAlpha = 1;
  cx.fillStyle = S.bg; cx.fillRect(0, 0, W, H);
  hitRects.clear();
  for (let i = S.tracks.length - 1; i >= 0; i--){
    const tr = S.tracks[i]; if (tr.hidden) continue;
    const act = activeVisual(tr, t);
    for (const c of act){
      let p = 1;
      // While paused, the selected clip is shown fully (ignoring its fade in/out) so it can be edited
      const editing = !playing && !exporting && c.id === sel;
      if (!editing && c.trans !== 'none' && c.transDur > 0 && t - c.start < c.transDur){
        p = ease((t - c.start) / c.transDur);
        const prev = tr.clips.find(o => o !== c && o.type !== 'audio' && o.start < c.start && Math.abs(o.start + o.dur - c.start) < 0.05);
        if (prev && !act.includes(prev)) drawClip(prev, prev.start + prev.dur - 0.001, 1, 'none', false, true);
      }
      drawClip(c, t, p, c.trans, true, editing);
    }
  }
  if (!exporting && sel){
    const r = hitRects.get(sel);
    if (r){ cx.save(); cx.strokeStyle = '#4f8cff'; cx.lineWidth = Math.max(2, W/500); cx.setLineDash([W/100, W/160]); cx.strokeRect(r.x, r.y, r.w, r.h); cx.restore(); }
  }
  $('#time').textContent = fmt(t) + ' / ' + fmt(totalDur());
}

/* ---------- playback ---------- */
let playT0 = 0, wall0 = 0;
function play(){
  if (playing) return;
  const td = totalDur(); if (td <= 0) return;
  ensureAudio();
  if (t >= td - 0.02) t = 0;
  playing = true; playT0 = t; wall0 = performance.now();
  $('#play').textContent = '⏸';
  nextFrame();
}
function nextFrame(){ let done = false; const go = () => { if (!done){ done = true; loop(); } }; requestAnimationFrame(go); setTimeout(go, 40); }
function pause(){
  playing = false; $('#play').textContent = '▶';
  for (const e of els.values()) e.pause();
  render(); updatePlayhead();
}
function loop(){
  if (!playing) return;
  t = playT0 + (performance.now() - wall0) / 1000;
  const td = totalDur();
  if (exporting){ $('#ovbar').style.width = (100 * t / td).toFixed(1) + '%'; $('#ovtxt').textContent = fmt(t) + ' / ' + fmt(td); }
  if (t >= td){
    t = td; render();
    if (exporting) finishExport();
    pause(); return;
  }
  render(); updatePlayhead(true);
  nextFrame();
}
function setT(v){ t = clamp(v, 0, Math.max(totalDur(), 0)); if (playing){ playT0 = t; wall0 = performance.now(); } render(); updatePlayhead(); }

/* ---------- export ---------- */
let rec = null, chunks = [], cancelled = false;
async function exportVideo(){
  const td = totalDur();
  if (td <= 0){ alert(T('The timeline is empty.')); return; }
  if (typeof MediaRecorder === 'undefined'){ alert(T('This browser cannot export video. Please use Chrome or Edge.')); return; }
  pause(); ensureAudio(); await actx.resume();
  exporting = true; cancelled = false;
  $('#ov').hidden = false; $('#ovbar').style.width = '0'; $('#ovtxt').textContent = T('Preparing…');
  t = 0; render(); await new Promise(r => setTimeout(r, 1000)); render();
  const stream = cv.captureStream(30);
  for (const a of recDest.stream.getAudioTracks()) stream.addTrack(a);
  const mimes = ['video/mp4;codecs=avc1.640028,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = mimes.find(m => MediaRecorder.isTypeSupported(m));
  const px = S.w * S.h;
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: px >= 3840*2160 ? 40e6 : px >= 1920*1080 ? 16e6 : 10e6, audioBitsPerSecond: 192000 });
  chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    exporting = false; $('#ov').hidden = true; render();
    if (cancelled) return;
    ping('export', { dur: Math.round(td) });
    const blob = new Blob(chunks, { type: mime.split(';')[0] });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'video_' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + (mime.includes('mp4') ? '.mp4' : '.webm');
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  };
  rec.start(1000);
  play();
}
function finishExport(){ if (rec && rec.state !== 'inactive') rec.stop(); }
$('#ovcancel').onclick = () => { cancelled = true; pause(); finishExport(); };

/* ---------- library UI ---------- */
function renderLibrary(){
  const L = $('#libList'); L.innerHTML = '';
  if (!media.size){ L.innerHTML = '<div class="empty">' + T('html.libEmpty') + '</div>'; return; }
  for (const m of media.values()){
    const d = document.createElement('div'); d.className = 'mi'; d.draggable = true;
    d.title = T('Drag onto the timeline, or click + to append to the selected track');
    d.ondragstart = e => { e.dataTransfer.setData('text/media-id', m.id); e.dataTransfer.effectAllowed = 'copy'; };
    const th = m.type === 'image' ? `<img src="${m.url}">` : m.type === 'video' ? `<video src="${m.url}#t=0.5" muted preload="metadata"></video>` : '<div class="ai">♫</div>';
    const lbl = T({ image:'Image', video:'Video', audio:'Audio' }[m.type]);
    d.innerHTML = `<div class="th">${th}</div><div class="mn"><div class="nm"></div><small>${lbl}${m.duration ? ' · ' + fmt(m.duration) : ''}</small></div><button class="icon add" title="${T('Append to the selected track')}">＋</button><button class="icon del" title="${T('Remove from library')}">×</button>`;
    d.querySelector('.nm').textContent = m.name;
    d.querySelector('.add').onclick = () => addMediaToTrack([m], m.type === 'audio' ? audioTrack() : curTrack());
    d.querySelector('.del').onclick = () => {
      const used = S.tracks.some(tr => tr.clips.some(c => c.mediaId === m.id));
      if (used && !confirm(T('This file is used on the timeline. Delete the clips that use it as well?'))) return;
      for (const tr of S.tracks) tr.clips = tr.clips.filter(c => c.mediaId !== m.id);
      media.delete(m.id); renderLibrary(); commit();
    };
    L.appendChild(d);
  }
}

function snapTime(v, self, alsoEnd){

function canvasPt(e){ const r = cv.getBoundingClientRect(); return { x:(e.clientX - r.left) * S.w / r.width, y:(e.clientY - r.top) * S.h / r.height }; }

  if (!pdrag) return;
  const pt = canvasPt(e), c = pdrag.c;
  c.x = pdrag.ox + (pt.x - pdrag.sx) / S.w; c.y = pdrag.oy + (pt.y - pdrag.sy) / S.h;
  if (Math.abs(c.x) < 0.01) c.x = 0; if (Math.abs(c.y) < 0.01) c.y = 0;
  pdrag.moved = true; draw();
});
cv.addEventListener('pointerup', () => { if (pdrag && pdrag.moved) commit(); pdrag = null; });
cv.addEventListener('wheel', e => {
  const [c] = findClip(sel); if (!c || c.type === 'audio') return;
  e.preventDefault();
  c.scale = clamp(c.scale * (e.deltaY < 0 ? 1.05 : 1/1.05), 0.05, 5); draw();
  clearTimeout(wheelTimer); wheelTimer = setTimeout(() => commit(), 400);
}, { passive:false });

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  const k = e.key.toLowerCase();
  if (e.code === 'Space'){ e.preventDefault(); playing ? pause() : play(); }
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); delSel(); }
  else if (e.ctrlKey && k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
  else if (e.ctrlKey && (k === 'y' || (k === 'z' && e.shiftKey))){ e.preventDefault(); redo(); }
  else if (e.ctrlKey && k === 'd'){ e.preventDefault(); dup(); }
  else if (k === 's' && !e.ctrlKey){ split(); }
  else if (k === 'arrowleft'){ setT(t - (e.shiftKey ? 5 : 1/30*3)); }
  else if (k === 'arrowright'){ setT(t + (e.shiftKey ? 5 : 1/30*3)); }
  else if (k === 'home'){ setT(0); }
});
window.addEventListener('beforeunload', e => { if (totalDur() > 0){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => renderTimeline());

/* ---------- init ---------- */
document.querySelectorAll('img[data-logo]').forEach(i => i.src = document.querySelector('link[rel=icon]').href);
applyStatic();
$('#aboutVer').textContent = 'v' + APP_VERSION;
renderLibrary();
commit();
ping('open');
</script>
</body>
</html>
